services:
  - type: web
    name: pdv-bling-fidelizei-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build -w @pdv/api
    startCommand: npm start -w @pdv/api
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pdv-bling-fidelizei-db
          property: connectionString
      - key: CREDENTIALS_ENCRYPTION_KEY
        generateValue: true
      - key: BLING_CLIENT_ID
        sync: false
      - key: BLING_CLIENT_SECRET
        sync: false
      - key: BLING_REDIRECT_URI
        sync: false
      - key: FIDELIZEI_API_URL
        value: https://api.fidelizaplus.com.br/public/v1
      - key: FIDELIZEI_API_KEY
        sync: false
      - key: PDV_WEB_URL
        sync: false
      - key: PDV_AUTH_SECRET
        generateValue: true
      - key: PDV_OPERATOR_PIN
        sync: false
      - key: PDV_MANAGER_PIN
        sync: false
      - key: PDV_ADMIN_PIN
        sync: false
      - key: PDV_REQUIRE_INDIVIDUAL_PIN
        sync: false
      - key: BLING_COMPANY_ID
        sync: false
      - key: BLING_COMPANY_CNPJ
        sync: false
      - key: BLING_FINAL_CONSUMER_CONTACT_ID
        sync: false

  - type: web
    name: pdv-bling-fidelizei-web
    runtime: static
    buildCommand: npm ci && npm run build -w @pdv/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: pdv-bling-fidelizei-db
    plan: basic-256mb
